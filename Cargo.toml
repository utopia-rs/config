[package]
name = "utopia-config"
description = "Application configuration: a process-wide parameter registry, and typed configs loaded from env, dotenv, JSON, YAML or PHP files and validated against a schema."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
repository = "https://github.com/utopia-rs/config"

[dependencies]
php-std = { version = "0.1.0", git = "https://github.com/utopia-rs/php-std" }
thiserror = "2"
utopia-validators = { version = "0.1.0", git = "https://github.com/utopia-rs/validators" }

[package.metadata.utopia]
php-sync = "809d2819d7da00d8b2f486e3bcb4c98a5265e950"